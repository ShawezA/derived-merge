[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "derived-merge"
version = "0.1.0"
description = "Git merge driver for lockfiles and other identity-keyed generated files"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["git", "merge", "lockfile", "package-lock", "yarn.lock", "monorepo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ShawezA/derived-merge"
Issues = "https://github.com/ShawezA/derived-merge/issues"

[project.scripts]
derived-merge = "derived_merge.cli:entrypoint"

[tool.setuptools]
package-dir = { "derived_merge" = "src" }

[tool.setuptools.packages.find]
where = ["."]
include = ["derived_merge*"]
